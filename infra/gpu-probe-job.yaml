apiVersion: batch/v1
kind: Job
metadata:
  name: churn-gpu-probe-${TEAM}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - name: probe
        image: nvcr.io/nvidia/jax:25.01-py3
        imagePullPolicy: IfNotPresent
        command: ["python", "-c"]
        args:
        - |
          import platform
          import jax, numpy, pandas, sklearn
          print("architecture=", platform.machine())
          print("jax_version=", jax.__version__)
          print("numpy_version=", numpy.__version__)
          print("pandas_version=", pandas.__version__)
          print("sklearn_version=", sklearn.__version__)
          print("jax_devices=", jax.devices())
        resources:
          requests: {nvidia.com/gpu: "1", cpu: "1", memory: "2Gi"}
          limits: {nvidia.com/gpu: "1", cpu: "1", memory: "2Gi"}
