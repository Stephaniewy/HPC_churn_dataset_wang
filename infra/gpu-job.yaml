apiVersion: batch/v1
kind: Job
metadata:
  name: churn-gpu-${TEAM}-${RUN_ID}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
      - name: benchmark
        # Public GHCR image built from Dockerfile.gpu and pinned by digest.
        image: ghcr.io/stephaniewy/hpc_churn_dataset_wang-gpu@sha256:c4ff36e4f45a8fe2f7455f35c5fccbf0f80510505ad9ca1b2217c18cfeb22882
        imagePullPolicy: IfNotPresent
        env:
        - name: XLA_PYTHON_CLIENT_PREALLOCATE
          value: "false"
        args: ["--run-name", "gpu-${TEAM}-${RUN_ID}", "--output-dir", "/results", "--epochs", "${EPOCHS}"]
        resources:
          requests: {nvidia.com/gpu: "1", cpu: "4", memory: "16Gi"}
          limits: {nvidia.com/gpu: "1", cpu: "4", memory: "16Gi"}
        volumeMounts:
        - {name: churn-data, mountPath: /input, readOnly: true}
      volumes:
      - name: churn-data
        configMap: {name: churn-data-${TEAM}}
